name: Build APK

# Builds a debug APK you can sideload: Actions tab > Build APK > Run workflow,
# then download "PokeDaisy-debug" from the finished run's Artifacts.
on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships the Android SDK and its command-line tools;
      # add what this project pins (the NDK and CMake usually aren't there).
      - name: SDK packages
        run: |
          set -o pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$ANDROID_HOME" || { echo "::error::No Android SDK at ANDROID_HOME=$ANDROID_HOME"; exit 1; }
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;28.2.13676358" "cmake;3.22.1" 2>&1 | tail -5 \
            || { echo "::error::sdkmanager failed"; exit 1; }

      - uses: gradle/actions/setup-gradle@v4

      # The same (throwaway, debug-only) key every run, so each new APK installs
      # over the last one and keeps its saves. A fresh runner would otherwise
      # sign with a new random debug key.
      - name: Fixed debug key
        run: mkdir -p ~/.android && cp .github/sidebyside-debug.keystore ~/.android/debug.keystore

      - name: Build
        run: |
          set -o pipefail
          if ! ./gradlew :app:assembleDebug -PsideBySide --stacktrace 2>&1 | tee build.log; then
            # The errors as annotations too: they show on the run's summary page.
            grep -E "^e: |error:|What went wrong|FAILED|Exception" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            echo "::error title=build tail::$(tail -30 build.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PokeDaisy-debug
          path: app/build/outputs/apk/debug/*.apk
